<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qui est ta cruche ?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(120deg, #ff8fc7, #ffc2e2, #9ad0ff, #5aa9ff, #9ad0ff, #ffc2e2, #ff8fc7);
      background-size: 300% 300%;
      animation: bgShift 14s ease-in-out infinite;
      overflow-x: hidden;
    }
    @keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .heart {
      position: fixed; bottom: -40px; pointer-events: none; user-select: none; opacity: 0;
      animation: floatUp linear infinite; z-index: 0;
    }
    @keyframes floatUp { 0%{transform:translateY(0) rotate(0deg) scale(.8);opacity:0} 10%{opacity:.7} 100%{transform:translateY(-110vh) rotate(25deg) scale(1.2);opacity:0} }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }

    .card {
      background: rgba(255,255,255,.92); backdrop-filter: blur(14px);
      padding: 38px 26px 30px; border-radius: 30px; text-align: center;
      border: 1px solid rgba(255,255,255,.75);
      box-shadow: 0 26px 80px rgba(60,60,160,.32), 0 0 0 7px rgba(255,255,255,.25);
      animation: cardIn .55s cubic-bezier(.2,.9,.3,1.2) both;
      position: relative; overflow: hidden;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(22px) scale(.94)} to{opacity:1;transform:none} }
    .card::before {
      content: ''; position: absolute; inset: 0; border-radius: 30px; padding: 2px;
      background: linear-gradient(135deg, #ff8fc7, #9ad0ff, #ff8fc7); background-size: 300% 300%;
      animation: bgShift 8s ease-in-out infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }

    /* ---------- Intro ---------- */
    .intro-icon { font-size: 54px; margin-bottom: 6px; animation: bounce 2.2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    h1 {
      margin: 0 0 10px; font-size: 27px; font-weight: 900; letter-spacing: -.5px;
      background: linear-gradient(90deg, #ff3d8b, #ff7ab8, #3d8bff, #ff3d8b);
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent; animation: textShift 6s linear infinite;
    }
    @keyframes textShift { to { background-position: 300% 0; } }
    .intro-sub { color: #8b7fb8; font-size: 14.5px; font-weight: 600; line-height: 1.5; margin: 0 0 26px; }
    .intro-count { color: #c3b9e8; font-size: 12px; font-weight: 700; margin-top: 14px; }

    /* ---------- Carte message ---------- */
    .count-sub { color: #b3aad6; font-size: 12.5px; font-weight: 700; margin: 0 0 18px; }
    .m-tag {
      display: inline-block; font-size: 11.5px; font-weight: 800; padding: 4px 12px; border-radius: 999px;
      margin-bottom: 14px; color: #fff;
    }
    .fille .m-tag { background: #ff4d8d; }
    .gars .m-tag { background: #3d8bff; }

    .m-text {
      font-size: 20px; font-weight: 800; line-height: 1.35; word-break: break-word;
      min-height: 60px; display: flex; align-items: center; justify-content: center;
      color: #2d2748;
    }
    .m-text.slide-next { animation: slideNext .32s ease both; }
    .m-text.slide-prev { animation: slidePrev .32s ease both; }
    @keyframes slideNext { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:none} }
    @keyframes slidePrev { from{opacity:0;transform:translateX(-18px)} to{opacity:1;transform:none} }

    .dots { display: flex; justify-content: center; gap: 5px; margin-top: 16px; flex-wrap: wrap; max-width: 220px; margin-left: auto; margin-right: auto; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #e4dcff; transition: all .2s; }
    .dot.on { background: linear-gradient(135deg,#ff4d8d,#3d8bff); width: 16px; }

    .nav-row { display: flex; gap: 10px; margin-top: 24px; }
    button.nav-btn {
      flex: 1; padding: 15px 10px; font-size: 14.5px; font-weight: 900; border: none; border-radius: 16px;
      cursor: pointer; transition: transform .12s, box-shadow .12s;
    }
    button.nav-btn:active { transform: translateY(1px) scale(.97); }
    button#prev-btn { background: #f1edff; color: #7a6fa3; }
    button#prev-btn:hover { background: #e6ddff; }
    button#next-btn {
      color: #fff; background: linear-gradient(90deg, #ff4d8d, #ff7ab8, #4d94ff, #ff4d8d); background-size: 300% 100%;
      animation: textShift 6s linear infinite; box-shadow: 0 10px 24px rgba(255,77,141,.4);
    }
    button#next-btn:hover { box-shadow: 0 14px 28px rgba(77,148,255,.45); }

    button.start-btn {
      width: 100%; padding: 17px; font-size: 16.5px; font-weight: 900; letter-spacing: .3px;
      color: #fff; border: none; border-radius: 16px; cursor: pointer;
      background: linear-gradient(90deg, #ff4d8d, #ff7ab8, #4d94ff, #ff4d8d); background-size: 300% 100%;
      animation: textShift 6s linear infinite;
      box-shadow: 0 10px 26px rgba(255,77,141,.4);
      transition: transform .12s, box-shadow .12s;
    }
    button.start-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 30px rgba(77,148,255,.45); }
    button.start-btn:active { transform: translateY(1px) scale(.98); }

    .results-empty { color: #9ca3af; font-size: 14px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="intro-card">
      <div class="intro-icon">💘</div>
      <h1>Qui est ta cruche ?</h1>
      <p class="intro-sub">Découvre, un par un, qui les gens ont nommé —<br />à ton rythme, dans les deux sens.</p>
      <button class="start-btn" id="start-btn" type="button">🔍 Découvrir les cruches</button>
      <p class="intro-count" id="intro-count"></p>
    </div>

    <div class="card hidden" id="browser-card">
      <p class="count-sub" id="counter"></p>
      <div id="content"></div>
      <div class="dots" id="dots"></div>
      <div class="nav-row">
        <button class="nav-btn" id="prev-btn" type="button">◀ Précédent</button>
        <button class="nav-btn" id="next-btn" type="button">Suivant ▶</button>
      </div>
    </div>
  </div>

  <script src="messages.js"></script>
  <script>
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text; // jamais interprété comme du HTML
      return e;
    }
    /** Mélange l'ordre une fois au chargement, pour ne pas revoir tout dans le même ordre à chaque visite. */
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const order = shuffle(MESSAGES.filter((m) => m && m.text && m.text.trim()));
    let index = 0;

    const introCard = document.getElementById('intro-card');
    const browserCard = document.getElementById('browser-card');
    const contentEl = document.getElementById('content');
    const counterEl = document.getElementById('counter');
    const dotsEl = document.getElementById('dots');

    document.getElementById('intro-count').textContent =
      order.length + ' message' + (order.length !== 1 ? 's' : '') + ' à découvrir';

    function renderDots() {
      dotsEl.innerHTML = '';
      const max = Math.min(order.length, 30); // évite des centaines de points si la liste grossit un jour
      for (let i = 0; i < max; i++) {
        dotsEl.appendChild(el('span', 'dot' + (i === index ? ' on' : '')));
      }
    }

    function show(direction) {
      if (order.length === 0) {
        counterEl.textContent = '';
        contentEl.innerHTML = '';
        contentEl.appendChild(el('p', 'results-empty', 'Aucun message pour le moment.'));
        dotsEl.innerHTML = '';
        document.querySelector('.nav-row').classList.add('hidden');
        return;
      }

      const m = order[index];
      const kind = m.kind === 'gars' ? 'gars' : 'fille';
      browserCard.className = 'card ' + kind;

      counterEl.textContent = 'Message ' + (index + 1) + ' / ' + order.length;

      contentEl.innerHTML = '';
      contentEl.appendChild(el('div', 'm-tag', kind === 'fille' ? '👧 Fille' : '👦 Gars'));
      const textEl = el('div', 'm-text' + (direction ? ' slide-' + direction : ''), m.text);
      contentEl.appendChild(textEl);

      renderDots();
    }

    function next() {
      index = (index + 1) % order.length;
      show('next');
    }
    function prev() {
      index = (index - 1 + order.length) % order.length;
      show('prev');
    }

    document.getElementById('next-btn').addEventListener('click', next);
    document.getElementById('prev-btn').addEventListener('click', prev);

    document.getElementById('start-btn').addEventListener('click', () => {
      introCard.classList.add('hidden');
      browserCard.classList.remove('hidden');
      show();
    });

    // Décor : coeurs roses et bleus qui montent doucement
    const HEARTS = ['💗', '💖', '💙', '💘', '💕'];
    for (let i = 0; i < 16; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = HEARTS[i % HEARTS.length];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = 16 + Math.random() * 26 + 'px';
      h.style.animationDuration = 9 + Math.random() * 10 + 's';
      h.style.animationDelay = -Math.random() * 18 + 's';
      document.body.appendChild(h);
    }
  </script>
</body>
</html>
